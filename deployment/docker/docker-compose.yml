# Compose file for a self-hosted NixFact stack.
#
# Network segmentation: only the `nixfact` web service is on the `frontend`
# network (alongside any reverse-proxy). MariaDB, Redis, workers and the
# scheduler live on `backend` only — `internal: true` denies outbound
# internet access from the data plane.
#
# Build once, run many: the `nixfact` service builds the image and tags it;
# workers and scheduler reference the tag via `image:` so we don't rebuild
# 1.5GB four times.

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    networks: [backend]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set}
      MYSQL_USER: ${DB_USER:?DB_USER must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/frappe.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    mem_limit: 1g
    pids_limit: 200

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_cache:/data
    security_opt: ["no-new-privileges:true"]
    # Nested in an unprivileged LXC the redis entrypoint steps down from root to
    # the redis user (setpriv), needing these caps; cap_drop:[ALL] alone
    # crash-loops with "setresuid: Operation not permitted".
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, SETPCAP]
    mem_limit: 192m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_queue:/data
    security_opt: ["no-new-privileges:true"]
    # See redis-cache: caps needed for the entrypoint's privilege drop in LXC.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, SETPCAP]
    mem_limit: 192m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nixfact:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    image: nixfact:${NIXFACT_TAG:-local}
    restart: unless-stopped
    networks: [frontend, backend]
    depends_on:
      mariadb: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CACHE: redis://:${REDIS_PASSWORD}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD}@redis-queue:6379
      SITE_NAME: ${SITE_NAME:?SITE_NAME must be set}
      # Public half of the backup key. The private half never reaches this host:
      # it lives in /root/.secrets on the Proxmox node. age needs only the
      # recipient to encrypt, so a compromise here cannot decrypt old backups.
      NIXFACT_AGE_RECIPIENT: ${NIXFACT_AGE_RECIPIENT:-}
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - logs_data:/home/frappe/frappe-bench/logs
      # Backups land straight on the HDD-backed bind-mount, already encrypted,
      # where borgmatic on CT200 picks them up. See deployment/systemd/.
      - ${BACKUP_DIR:-/mnt/nixfact/backups}:/backups
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HTTP_PORT:-8080}:8000"
    # Send the site's Host header: Frappe resolves the site from Host, and a
    # bare 127.0.0.1 matches no site (404). Declared here rather than in the
    # image because worker and scheduler share that image and never serve HTTP.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${SITE_NAME}\" http://127.0.0.1:8000/api/method/ping || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1500m
    pids_limit: 500
    read_only: false  # Frappe writes to /home/frappe/frappe-bench/sites — mount handles it

  worker:
    image: nixfact:${NIXFACT_TAG:-local}
    restart: unless-stopped
    networks: [backend]
    depends_on:
      nixfact: {condition: service_healthy}
    # short+long+default: Frappe v17 stuurt alles behalve Long/Maintenance naar
    # "default" (ScheduledJobType.get_queue_name). Zonder default-consumer
    # stapelen hourly/daily/cron-jobs onzichtbaar op in redis.
    command: ["bench", "worker", "--queue", "short,long,default"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_CACHE: redis://:${REDIS_PASSWORD}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD}@redis-queue:6379
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    # Asks RQ whether this container's worker still checks in — see the script.
    # start_period covers bench startup before the worker registers itself.
    healthcheck:
      test: ["CMD", "/healthcheck-worker.sh"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 200

  socketio:
    image: nixfact:${NIXFACT_TAG:-local}
    restart: unless-stopped
    # backend-only: Caddy (VPS) bereikt deze via de gepubliceerde poort, net
    # als de webdienst. Zonder deze service + Caddy-route voor /socket.io
    # blijft realtime (o.a. Frappe CRM) 404-en op productie.
    networks: [backend]
    depends_on:
      redis-queue: {condition: service_healthy}
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_CACHE: redis://:${REDIS_PASSWORD}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD}@redis-queue:6379
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SOCKETIO_PORT:-9000}:9000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 100

  scheduler:
    image: nixfact:${NIXFACT_TAG:-local}
    restart: unless-stopped
    networks: [backend]
    depends_on:
      nixfact: {condition: service_healthy}
    command: ["bench", "schedule"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_CACHE: redis://:${REDIS_PASSWORD}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD}@redis-queue:6379
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
    # Deliberately no healthcheck. `bench schedule` is a bare
    # `while True: sleep(tick); enqueue_events_for_all_sites()` with no
    # heartbeat to probe, and Frappe's own is_schduler_process_running() says of
    # its flock check: "We can't determine if process is stuck somewhere."
    # Death is already covered — tini exits with the loop and restart:
    # unless-stopped brings it back. A probe that claims more than that is the
    # exact failure this stack just removed. "Is the scheduler enqueueing?"
    # belongs in monitoring, watching Scheduled Job Type.last_execution.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 100

networks:
  frontend: {}
  backend:
    internal: true  # data plane has no outbound internet

volumes:
  mariadb_data:
  redis_cache:
  redis_queue:
  sites_data:
  logs_data:
