# NixFact reverse-proxy config.
#
# This file goes into nginx's main http {} block; rate-limit zones must
# live there. If you include this from `sites-available/`, copy the
# `limit_req_zone` lines into `nginx.conf` (http context) instead.

# Per-IP rate limiting.
limit_req_zone $binary_remote_addr zone=nixfact_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=nixfact_api:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=nixfact_webhook:10m rate=10r/s;

# Trust proxy headers ONLY from configured upstream IPs.
# Replace 127.0.0.1 with your actual proxy CIDR (Cloudflare, HAProxy, …).
# Comment this block out if NGINX terminates TLS directly.
# set_real_ip_from 173.245.48.0/20;       # Cloudflare
# set_real_ip_from 103.21.244.0/22;
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;

upstream nixfact_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen      80;
    server_name nixfact.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name nixfact.example.com;

    # ----- TLS (Mozilla intermediate, 2025) -----
    ssl_certificate     /etc/letsencrypt/live/nixfact.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixfact.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nixfact.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:nixfact_ssl:10m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # ----- Body sizes -----
    # 50M default, tighter on login (no body), generous on file uploads.
    client_max_body_size 50M;

    # ----- Compression -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ----- Webhook endpoints -----
    # Mollie webhooks land here. There is no shared secret, so we rate-limit
    # and let the application do an authoritative re-fetch.
    # Optionally restrict to Mollie's published source ranges:
    # location ~ ^/api/method/nixfact_integration\.integrations\.mollie\.webhook {
    #     allow 87.233.229.0/24;     # verify ranges at deploy time
    #     allow 87.233.217.0/24;
    #     deny  all;
    #     limit_req zone=nixfact_webhook burst=20 nodelay;
    #     proxy_pass http://nixfact_backend;
    #     include /etc/nginx/conf.d/nixfact_proxy.inc;
    # }

    # ----- Login bruteforce protection -----
    location = /api/method/login {
        client_max_body_size 8k;
        limit_req zone=nixfact_login burst=10 nodelay;
        proxy_pass http://nixfact_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- API rate limit -----
    location /api/method/ {
        limit_req zone=nixfact_api burst=50 nodelay;
        proxy_pass http://nixfact_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ----- Static assets — long cache -----
    location /assets {
        proxy_pass http://nixfact_backend;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----- Catch-all -----
    location / {
        proxy_pass http://nixfact_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
