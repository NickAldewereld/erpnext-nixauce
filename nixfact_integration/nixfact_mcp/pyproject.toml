[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nixfact-mcp"
version = "0.1.0"
description = "MCP server for Nixfact (Frappe/ERPNext invoicing app)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Nick Aldewereld", email = "nick@nixpay.nl" }]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
nixfact-mcp = "nixfact_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["nixfact_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
