name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege; widen per-job only where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --no-cache-dir ruff
      - name: Ruff check
        run: ruff check nixfact_integration/

  test:
    name: Unit tests (pure helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --no-cache-dir lxml pytest requests
      - name: Run tests
        env:
          PYTHONPATH: nixfact_integration
        run: |
          # Pure-helper tests (regex, fuzzy match, format string, namespace
          # constants, date arithmetic). The conftest in tests/ stubs the
          # `frappe` module so these run without a bench. Anything that
          # needs a Frappe site context must run via `bench --site …
          # run-tests` against a real site (TODO: add integration job when
          # bench fixtures land).
          pytest nixfact_integration/nixfact_integration/tests/ -v --tb=short

  mcp:
    name: nixfact-mcp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nixfact-mcp + dev deps
        working-directory: nixfact_integration/nixfact_mcp
        run: pip install --no-cache-dir -e ".[dev]"
      - name: Run pytest
        working-directory: nixfact_integration/nixfact_mcp
        run: pytest -q
